name: GLaDOS 每日签到

on:
  workflow_dispatch: # 允许你手动点击运行按钮
  schedule:
    - cron: '30 0 * * *' # 每天 UTC 时间 00:30 (北京时间早上 8:30) 自动运行

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 把你仓库里的纯净代码拉取下来 (使用的是 GitHub 官方组件，绝对不会被封)
    - name: 检出代码
      uses: actions/checkout@v4
      
    # 2. 配置 Python 环境 (官方组件)
    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    # 3. 安装依赖包 (比如 requests 库)
    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install requests
        
    # 4. 运行签到脚本
    - name: 运行签到
      env:
        # 这里填入你之前在 Secrets 里设置的变量名，通常叫 COOKIE 或 GLADOS_COOKIE
        COOKIE: ${{ secrets.COOKIE }} 
      run: |
        # 请确认你的主脚本名字是不是 glados.py，如果不是请改掉下面这行
        python glados.py
